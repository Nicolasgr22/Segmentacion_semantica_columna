[tox]
envlist = py310, py311, lint, type
skipsdist = false
isolated_build = false

# ─── Entorno base compartido ─────────────────────────────────────────────────
[testenv]
deps =
    pytest>=8.0
    pytest-cov>=5.0
    pytest-mock>=3.14
    -r requirements/requirements.txt
extras =
commands =
    pytest tests/ \
        -v \
        --tb=short \
        --cov=model \
        --cov-report=term-missing \
        --cov-fail-under=70 \
        {posargs}
setenv =
    PYTHONPATH = {toxinidir}
    PYTHONDONTWRITEBYTECODE = 1

# ─── Linting ─────────────────────────────────────────────────────────────────
[testenv:lint]
skip_install = true
deps =
    ruff>=0.4.0
commands =
    ruff check model/ {posargs}
    ruff format --check model/

# ─── Type checking ────────────────────────────────────────────────────────────
[testenv:type]
deps =
    mypy>=1.10
    -r requirements/requirements.txt
commands =
    mypy model/ \
        --ignore-missing-imports \
        --no-strict-optional \
        {posargs}

# ─── Entrenamiento + subida a Databricks ─────────────────────────────────────
# Uso:
#   tox -e train                       entrena y sube (omite si VERSION ya existe)
#   tox -e train -- --force            sube aunque VERSION ya esté registrada
#   tox -e train -- --no-upload        entrena sin subir
#   tox -e train -- --epochs 5 --force
[testenv:train]
deps =
    -r requirements/requirements.txt
    pyyaml>=6.0
    python-dotenv>=1.0
    databricks-sdk>=0.20
setenv =
    PYTHONPATH = {toxinidir}
passenv =
    DATABRICKS_HOST
    DATABRICKS_TOKEN
    MLFLOW_EXPERIMENT_NAME
commands =
    python -m model.train_runner {posargs}

# ─── Build: genera dist/model_medsam-x.y.z-py3-none-any.whl ─────────────────
[testenv:build]
skip_install = true
deps =
    wheel>=0.43
    setuptools>=70.0
commands =
    python setup.py sdist bdist_wheel

# ─── Formateo (no corre en CI, solo local) ────────────────────────────────────
[testenv:format]
skip_install = true
deps =
    ruff>=0.4.0
commands =
    ruff format model/
    ruff check --fix model/

# ─── pytest ──────────────────────────────────────────────────────────────────
[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short

# ─── coverage ────────────────────────────────────────────────────────────────
[coverage:run]
source = model
omit =
    tests/*
    model/config/*

[coverage:report]
show_missing = true
precision = 2
exclude_lines =
    pragma: no cover
    if TYPE_CHECKING:
    raise NotImplementedError

# ─── ruff ────────────────────────────────────────────────────────────────────
[ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
